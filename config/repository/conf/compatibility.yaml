# Release compatibility metadata.
#
# The release publishes this beside the distribution zips, so installation
# tooling can select the release for an installed Identity Server without
# running the product.
#
# The release fills in the supported versions. A development build leaves them
# empty rather than claiming a compatibility nobody has tested.

product: cdd

identity_server:
  # The Identity Server releases this CDD release has been verified against.
  #
  # The Console and the CDD extension bundles ship inside the Identity Server
  # distribution, so naming the Identity Server names them too — there is no
  # separate Console version for an operator to choose, and nothing here to
  # state about one.
  #
  # This is a statement about tested combinations rather than a version floor.
  supported: []
